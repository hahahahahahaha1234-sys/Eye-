<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EYE-AI 遠距眼部預檢系統</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 MediaPipe Face Mesh CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- 科技感背景 -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <header>
        <div class="header-left">
            <button id="back-home-btn" class="icon-btn hidden"><span class="geo-icon">◇</span> 首頁說明</button>
        </div>
        <h1 class="logo">EYE-AI <span class="badge">v2.0</span></h1>
        <div class="header-right"><span class="status-dot"></span> 系統連線</div>
    </header>

    <main>
        <!-- 頁面 1：首頁說明 -->
        <section id="intro-section" class="page-section">
            <div class="intro-container">
                <div class="hero-geo">
                    <div class="circle-outer"></div>
                    <div class="circle-inner"></div>
                </div>
                <h2>遠距醫療初篩系統</h2>
                <p class="intro-desc">整合 AI 臉部特徵網格與色彩校正技術，協助您進行居家高頻率的眼部追蹤監測。</p>
                <div class="geo-divider"><span>◆</span></div>
                
                <div class="action-area">
                    <button id="go-to-scan-btn" class="primary-btn">啟動 AI 網格掃描 <span class="arrow">→</span></button>
                </div>
            </div>
        </section>

        <!-- 頁面 2：掃描主畫面 -->
        <section id="scan-section" class="page-section hidden">
            <div class="camera-wrapper">
                <div class="camera-container">
                    <video id="camera-feed" autoplay playsinline></video>
                    <!-- 用於繪製網格的透明圖層 -->
                    <canvas id="tracking-overlay"></canvas>
                    
                    <!-- 科技感掃描框 -->
                    <div class="hud-bracket top-left"></div>
                    <div class="hud-bracket top-right"></div>
                    <div class="hud-bracket bottom-left"></div>
                    <div class="hud-bracket bottom-right"></div>
                    
                    <p class="instruction">AI 正在鎖定眼部特徵，請平視鏡頭</p>
                </div>
            </div>
            
            <div class="action-area">
                <button id="start-scan-btn" class="primary-btn">擷取特徵並分析</button>
            </div>
        </section>

        <!-- 頁面 3：結果畫面 -->
        <section id="result-section" class="page-section hidden">
            <div class="result-card">
                <div class="geo-header"><span class="geo-square"></span><h2 id="risk-level">分析完成</h2></div>
                <div class="scanned-image-placeholder">
                    <!-- 顯示拍照結果與 AI 網格 -->
                    <canvas id="snapshot-canvas"></canvas>
                </div>
                <p id="risk-description">綜合比對眼部特徵與疾病資料庫中...</p>
                <div class="action-area">
                    <button id="reset-btn" class="outline-btn">↺ 重新掃描</button>
                </div>
            </div>
        </section>
    </main>
    
    <!-- 讀取同一個資料夾內的 JS 檔案 (順序很重要) -->
    <script src="analyzer.js"></script>
    <script src="app.js"></script>
</body>
</html>
